name: Build & Sign Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Decode Base64 Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release-key.jks
            echo "Keystore successfully decoded to app/release-key.jks"
            ls -lh app/release-key.jks
          else
            echo "::warning::KEYSTORE_BASE64 is empty. Please set KEYSTORE_BASE64 secret for persistent signing."
          fi

      - name: Assemble Release APK
        env:
          SIGNING_STORE_FILE: "release-key.jks"
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Publish to GitHub Releases
        uses: ncipollo/release-action@v1
        with:
          artifacts: "app/build/outputs/apk/release/*.apk"
          tag: ${{ github.ref_name }}
          name: VaultCard ${{ github.ref_name }}
          body: |
            ### 💳 VaultCard Release ${{ github.ref_name }}
            
            - Built with Kotlin, Jetpack Compose, Material 3 & MIUIX theme
            - Room Database & Coroutines Flow
            - Biometric authentication & Calendar sync
            
            **Download and install the release APK below.**
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
