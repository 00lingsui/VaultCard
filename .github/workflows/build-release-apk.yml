name: Build & Sign Release APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed 's/.*"\(.*\)".*/\1/')
            if [ -z "$VERSION" ]; then
              VERSION="1.0.4"
            fi
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Target Release Tag: ${TAG}"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Prepare Persistent Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release-key.jks
            echo "Persistent release keystore decoded from KEYSTORE_BASE64 secret."
          elif [ -s "app/release-key.jks.base64" ]; then
            base64 --decode app/release-key.jks.base64 > app/release-key.jks
            echo "Persistent release keystore restored from persistent repository base64."
          elif [ -s "app/release-key.jks" ]; then
            echo "Persistent release keystore found in repository."
          else
            echo "::error::No persistent release keystore found! Provide KEYSTORE_BASE64 secret or keep app/release-key.jks."
            exit 1
          fi
          if [ ! -s "app/release-key.jks" ]; then
            echo "::error::Release keystore file 'app/release-key.jks' is empty or invalid!"
            exit 1
          fi
          echo "Persistent release keystore is ready."

      - name: Assemble Release APK
        env:
          SIGNING_STORE_FILE: ${{ github.workspace }}/app/release-key.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          export SIGNING_STORE_PASSWORD="${SIGNING_STORE_PASSWORD:-vaultcard123}"
          export SIGNING_KEY_ALIAS="${SIGNING_KEY_ALIAS:-vaultcard}"
          export SIGNING_KEY_PASSWORD="${SIGNING_KEY_PASSWORD:-vaultcard123}"
          ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Publish to GitHub Releases
        uses: ncipollo/release-action@v1
        with:
          artifacts: "app/build/outputs/apk/release/*.apk"
          tag: ${{ steps.release_tag.outputs.tag }}
          name: VaultCard ${{ steps.release_tag.outputs.tag }}
          generateReleaseNotes: true
          allowUpdates: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
